name: Build historical La Liga archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_history.py'
      - '.github/workflows/history.yml'
      - 'tests/test_history.py'

permissions:
  contents: write

concurrency:
  group: history-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical logic
        run: python -m unittest tests.test_history
      - name: Download and validate historical matches
        run: python scripts/build_history.py
      - name: Commit validated tables
        run: |
          git config user.name 'real-league-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A public/history
          git diff --cached --quiet || (git commit -m 'Publish validated historical La Liga tables' && git push)
