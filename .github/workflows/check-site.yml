name: Check public website DNS and HTTPS
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/check-site.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve site and test HTTPS
        shell: bash
        run: |
          echo "BASELINE: example.com resolves?"
          dig +short example.com A | head -5
          echo "CLOUDFLARE SITE DNS (default resolver)"
          dig the-real-league.pages.dev A +time=4 +tries=1
          echo "CLOUDFLARE SITE DNS (1.1.1.1)"
          dig @1.1.1.1 the-real-league.pages.dev A +time=5 +tries=1
          echo "CLOUDFLARE SITE DNS (8.8.8.8)"
          dig @8.8.8.8 the-real-league.pages.dev A +time=5 +tries=1
          echo "CLOUDFLARE SITE DNS (AAAA and CNAME)"
          dig the-real-league.pages.dev AAAA +noall +answer
          dig the-real-league.pages.dev CNAME +noall +answer
          echo "PUBLIC HTTPS"
          curl -sSL -o /dev/null -w "HTTP status=%{http_code} remote IP=%{remote_ip} redirect=%{url_effective}\n" --max-time 15 https://the-real-league.pages.dev/ || true
          echo "NEW DOMAIN AND ARCHIVE DNS"
          dig @1.1.1.1 usurperleague.com A +short
          echo "NEW DOMAIN LIVE HOMEPAGE"
          curl -sSL -o /dev/null -w "home HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/ || true
          echo "NEW DOMAIN LIVE INDEX"
          curl -sSL -o /dev/null -w "archive HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/la-liga/ || true
          echo "NEW DOMAIN LIVE 2023-24"
          curl -sSL -o /dev/null -w "2023-24 HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/la-liga/2023-24/ || true
          echo "NEW DOMAIN LIVE SITEMAP"
          curl -sSL -o /dev/null -w "sitemap HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/sitemap.xml || true
          echo "PREMIER LEAGUE PUBLIC PAGE"
          curl -sSL -o /dev/null -w "premier page HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/premier-league/
          echo "PREMIER LEAGUE VERIFIED JSON"
          curl -sSL -o /dev/null -w "premier data HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/data/premier-league.json
          echo "PREMIER LEAGUE JS"
          curl -sSL -o /dev/null -w "premier JS HTTP=%{http_code}\\n" --max-time 15 https://usurperleague.com/premier-league/league.js
          echo "BRAND HOME AND COUNTRY EDITIONS"
          curl -sSL -o /dev/null -w "brand HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/
          curl -sSL -o /dev/null -w "spain HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/spain/
          curl -sSL -o /dev/null -w "england HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/england/
          curl -sSL -o /dev/null -w "legacy-english HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/premier-league/
          curl -sSL -o /dev/null -w "home JS HTTP=%{http_code}\\n" --max-time 15 https://usurperleague.com/home.js
          curl -sSL -o /dev/null -w "spain results HTTP=%{http_code}\\n" --max-time 15 https://usurperleague.com/data/standings.json
          curl -sSL -o /dev/null -w "england results HTTP=%{http_code}\\n" --max-time 15 https://usurperleague.com/data/premier-league.json
          curl -fsSL --max-time 15 https://usurperleague.com/ | grep -q 'id="england-card"' && echo "Brand page has England choice"
          curl -fsSL --max-time 15 https://usurperleague.com/spain/ | grep -q 'id="league-table"' && echo "Spain page keeps working standings"
          curl -fsSL --max-time 15 https://usurperleague.com/england/ | grep -q 'id="premier-rows"' && echo "England page keeps working standings"
          echo "ENGLAND HISTORICAL ARCHIVE"
          curl -sSL -o /dev/null -w "english-history HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/england/history/
          curl -sSL -o /dev/null -w "1992-93 HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/england/history/1992-93/
          curl -sSL -o /dev/null -w "2015-16 HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/england/history/2015-16/
          curl -sSL -o /dev/null -w "england-config HTTP=%{http_code} dest=%{url_effective}\\n" --max-time 15 https://usurperleague.com/config/england.json
          curl -fsSL --max-time 15 https://usurperleague.com/england/history/ | grep -q 'Norwich City' && echo "English honours board contains genuine historic clubs"
          curl -fsSL --max-time 15 https://usurperleague.com/england/history/1992-93/ | grep -q 'Norwich City' && echo "1992/93 English historical table is published"
          echo "INTERACTIVE ENGLISH LEAGUE"
          curl -sSL -o /dev/null -w "core math HTTP=%{http_code}\\n" --max-time 15 https://usurperleague.com/premier-league/core.js
          curl -sSL -o /dev/null -w "club toggles HTTP=%{http_code}\\n" --max-time 15 https://usurperleague.com/premier-league/customizer.js
          curl -sSL -o /dev/null -w "current match scores HTTP=%{http_code}\\n" --max-time 15 https://usurperleague.com/data/premier-league-matches.json
          curl -sSL -o /dev/null -w "historical match scores HTTP=%{http_code}\\n" --max-time 15 https://usurperleague.com/england/history/matches/1992-93.json
          curl -fsSL --max-time 15 https://usurperleague.com/england/ | grep -q 'id="custom-season"' && echo "Season selector is deployed"
          curl -fsSL --max-time 15 https://usurperleague.com/england/ | grep -q 'id="custom-checks"' && echo "Excluded-club selector is deployed"
          curl -fsSL --max-time 15 https://usurperleague.com/england/history/1992-93/ | grep -q 'season=1992-93' && echo "Historic season links to its interactive view"
          echo "PERSONALISED SOCIAL LINK PREVIEW"
          curl -fsS --max-time 20 'https://usurperleague.com/share/england?season=1992-93&out=chelsea,manchester-city' > /tmp/usurper-share.html
          grep -q 'og:image' /tmp/usurper-share.html
          grep -q 'og:title' /tmp/usurper-share.html
          grep -q '1992/93' /tmp/usurper-share.html
          grep -q 'Chelsea' /tmp/usurper-share.html
          grep -q 'location.replace' /tmp/usurper-share.html
          curl -fsS --max-time 30 'https://usurperleague.com/share/image?season=1992-93&out=chelsea,manchester-city' > /tmp/usurper-social.png
          file /tmp/usurper-social.png
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/tmp/usurper-social.png').read_bytes()
          assert p[:8]==bytes([137,80,78,71,13,10,26,10]), 'Preview is not a PNG'
          assert struct.unpack('>II',p[16:24])==(1200,630)
          print('Live share preview: personalised HTML + valid 1200x630 PNG')
          PY
          echo "CLEAR ENGLISH ONBOARDING"
          curl -fsSL --max-time 20 https://usurperleague.com/england/ > /tmp/usurper-england.html
          grep -q 'What if the Big Six' /tmp/usurper-england.html
          grep -q 'We remove those clubs and every match they played' /tmp/usurper-england.html
          grep -q 'If Arsenal are out, this match disappears for both teams' /tmp/usurper-england.html
          grep -q 'Checked = club OUT' /tmp/usurper-england.html
          curl -fsSL --max-time 20 https://usurperleague.com/premier-league/customizer.js > /tmp/usurper-custom.js
          grep -q 'selected to remove' /tmp/usurper-custom.js
          echo "Live England page clearly explains exclusion rules and checked state"
          echo "BASELINE HTTPS"
          curl -sSL -o /dev/null -w "HTTP status=%{http_code}\n" --max-time 10 https://example.com/ || true
