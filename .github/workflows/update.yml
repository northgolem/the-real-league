name: Refresh La Liga standings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/update.py'
      - 'public/index.html'
      - 'public/enhance.js'
      - 'public/history.js'
      - 'tests/**'
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check calculator
        run: python -m unittest discover -s tests
      - name: Check bilingual JavaScript syntax
        run: node --check public/enhance.js
      - name: Check bilingual table behavior
        run: node tests/test_browser.mjs
      - name: Check new homepage language, current leaders and invalid data
        run: node tests/test_home.mjs
      - name: Check historical navigation syntax
        run: node --check public/history.js
      - name: Validate historical tables
        run: node tests/test_seasons.mjs
      - name: Check year picker and historical deep links
        run: node tests/test_history_ui.mjs
      - name: Update standings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SEASON: '2026'
        run: python scripts/update.py
      - name: Commit results if changed
        run: |
          git config user.name 'real-league-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/standings.json
          git diff --cached --quiet || (git commit -m 'Refresh La Liga standings' && git push)
