name: Refresh La Liga standings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/update.py'
      - 'tests/test_update.py'
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check calculator
        run: python -m unittest discover -s tests
      - name: Update standings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SEASON: '2026'
        run: python scripts/update.py
      - name: Commit results if changed
        run: |
          git config user.name 'real-league-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/standings.json
          git diff --cached --quiet || (git commit -m 'Refresh La Liga standings' && git push)
