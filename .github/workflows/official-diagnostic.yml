name: Diagnose historic La Liga reference tables
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/import_official_spain.py', '.github/workflows/official-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import_official_spain.py --dry-run --seasons 2023-24 1995-96 1928-29 1979-80
