name: Publish search-friendly historical pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_seo.py'
      - 'scripts/check_seo.py'
      - 'public/history/**'
      - '.github/workflows/seo.yml'

permissions:
  contents: write

concurrency:
  group: seo-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static historical league pages, honours board and sitemap
        run: python scripts/build_seo.py
      - name: Verify actual archived data, links and search metadata
        run: python scripts/check_seo.py
      - name: Publish generated historical pages and sitemap
        run: |
          git config user.name 'usurper-league-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A public/la-liga public/sitemap.xml
          git diff --cached --quiet || (git commit -m 'Publish search-friendly historical football pages' && git push)
