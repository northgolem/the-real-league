name: Publish search-friendly historical pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_seo.py'
      - 'scripts/build_england_seo.py'
      - 'scripts/season_story.py'
      - 'scripts/verified_spain.py'
      - 'public/official/spain/**'
      - 'tests/test_season_story.py'
      - 'public/config/england.json'
      - 'public/england/history/index.json'
      - 'public/england/history/seasons/**'
      - 'scripts/check_seo.py'
      - 'tests/test_spanish_season_compare.mjs'
      - 'public/la-liga/season-compare.js'
      - 'public/history/**'
      - '.github/workflows/seo.yml'

permissions:
  contents: write

concurrency:
  group: seo-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify season-specific insights from every archived table
        run: python -m unittest discover -s tests -p 'test_season_story.py'
      - name: Build static historical league pages, honours board and sitemap
        run: python scripts/build_seo.py
      - name: Verify actual archived data, links and search metadata
        run: python scripts/check_seo.py
      - name: Test Spanish historical toggle on all 94 years
        run: |
          node --check public/la-liga/season-compare.js
          node tests/test_spanish_season_compare.mjs
      - name: Publish generated historical pages and sitemap
        run: |
          git config user.name 'usurper-league-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A public/la-liga public/sitemap.xml
          if [ -d public/england/history ]; then git add -A public/england/history; fi
          git diff --cached --quiet || (git commit -m 'Publish search-friendly historical football pages' && git push)
